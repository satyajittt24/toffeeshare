// npm i ws
// node server.js -> listens on 3000
// for prod: use wss with certs + reverse proxy (nginx/caddy)
const http = require('http');
const WebSocket = require('ws');

const server = http.createServer((req,res)=>{
  if(req.url==='/health'){ res.writeHead(200); res.end('ok'); return; }
  res.writeHead(200,{'Content-Type':'text/plain'}); res.end('ToffeeShare signaling running\\nUse ws://host:3000');
});
const wss = new WebSocket.Server({ server });

// roomId -> { sender: ws, receiver: ws|null, meta, createdAt }
const rooms = new Map();
const ROOM_TTL = 1000*60*15; // 15min

function cleanRooms(){
  const now=Date.now();
  for(const [id,r] of rooms){
    if(now - r.createdAt > ROOM_TTL){ try{r.sender.close();}catch{} try{r.receiver?.close();}catch{} rooms.delete(id); console.log('expired',id); }
  }
}
setInterval(cleanRooms, 60*1000);

wss.on('connection',(ws)=>{
  let joinedRoom=null; let role=null;
  ws.on('message',(raw)=>{
    let msg; try{ msg=JSON.parse(raw); }catch{ return; }
    if(msg.type==='create-room'){
      const {roomId, meta}=msg;
      if(!roomId || rooms.has(roomId)){ ws.send(JSON.stringify({type:'error', error:'room-exists'})); return; }
      rooms.set(roomId,{sender:ws, receiver:null, meta, createdAt:Date.now()});
      joinedRoom=roomId; role='sender';
      ws.send(JSON.stringify({type:'room-created', roomId}));
      console.log('room created',roomId);
    }
    else if(msg.type==='join-room'){
      const {roomId}=msg;
      const room=rooms.get(roomId);
      if(!room){ ws.send(JSON.stringify({type:'room-not-found', roomId})); return; }
      room.receiver=ws;
      joinedRoom=roomId; role='receiver';
      ws.send(JSON.stringify({type:'room-joined', roomId, meta:room.meta}));
      room.sender.send(JSON.stringify({type:'peer-joined', roomId}));
      console.log('peer joined',roomId);
    }
    else if(msg.type==='signal'){
      const {roomId, data}=msg;
      const room=rooms.get(roomId);
      if(!room) return;
      // forward to other peer
      const target = role==='sender' ? room.receiver : room.sender;
      if(target && target.readyState===WebSocket.OPEN){
        target.send(JSON.stringify({type:'signal', roomId, data}));
      }
    }
  });
  ws.on('close',()=>{
    if(!joinedRoom) return;
    const room=rooms.get(joinedRoom);
    if(!room) return;
    if(role==='sender'){
      // sender leaves -> close room, notify receiver
      try{ room.receiver?.send(JSON.stringify({type:'sender-left', roomId:joinedRoom})); }catch{}
      rooms.delete(joinedRoom);
      console.log('room closed (sender left)',joinedRoom);
    } else {
      // receiver leaves
      room.receiver=null;
      try{ room.sender.send(JSON.stringify({type:'receiver-left', roomId:joinedRoom})); }catch{}
      console.log('receiver left',joinedRoom);
    }
  });
